name: Update INCY routing profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-routing-profile
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build profile
        run: python scripts/build.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Commit changed generated files
        run: |
          if git diff --quiet -- dist build; then
            echo "No source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist build
          git commit -m "chore: update INCY routing profile"
          git push

